<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#0055C8"/>
    </linearGradient>

    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5D2"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>
  </defs>

  <g transform="translate(-5, 0)">
    <!-- Outer Wave Ring -->
    <path d="M 15,62 C 10,35 25,12 50,10 C 72,8 88,24 85,50 C 82,75 58,95 28,92 C 18,91 10,84 15,62 Z" 
          fill="none" stroke="url(#favTeal)" stroke-width="7" stroke-linecap="round" opacity="0.4"/>

    <!-- Tooth Shape -->
    <path d="M 32,32 
             C 32,20 44,14 52,22 
             C 56,26 58,26 62,22 
             C 70,14 82,20 82,32 
             C 82,52 74,72 68,85 
             C 65,92 59,92 57,85 
             C 53,72 49,72 45,85 
             C 43,92 37,92 34,85 
             C 28,72 32,52 32,32 Z" 
          fill="url(#favBlue)"/>

    <!-- Tooth Highlight -->
    <path d="M 39,32 C 39,25 46,21 52,27 C 48,38 46,55 48,70 C 42,60 39,46 39,32 Z" 
          fill="#FFFFFF" opacity="0.4"/>

    <!-- Smile Wave Arc -->
    <path d="M 18,52 C 32,80 62,94 92,72" 
          fill="none" stroke="url(#favTeal)" stroke-width="8.5" stroke-linecap="round"/>

    <!-- Sparkle Accent -->
    <path d="M 88,26 Q 88,34 96,34 Q 88,34 88,42 Q 88,34 80,34 Q 88,34 88,26 Z" 
          fill="url(#favTeal)"/>
  </g>
</svg>
